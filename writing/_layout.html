<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} · RayveLabs</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="https://rayvelabs.com{{PATH}}">
<link rel="alternate" type="application/rss+xml" title="RayveLabs Writing" href="/writing/feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fbfbf9;--bg-deep:#f4efe3;--paper:#fff;--ink:#1a1a1a;--dim:#525252;--faint:#909090;--rule:#d4d4d4;--rule-faint:#e9e6df;--gold:#9d8552;--gold-bright:#c4a565;--gold-soft:rgba(157,133,82,.12)}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased}
  a{color:var(--gold);text-decoration:none}a:hover{text-decoration:underline}
  .nav{display:flex;align-items:center;gap:18px;padding:18px 28px;border-bottom:1px solid var(--rule-faint);background:rgba(251,251,249,.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
  .brand{display:flex;align-items:center;gap:9px;font-family:'Source Serif Pro',Georgia,serif;font-weight:700;font-size:19px;color:var(--ink)}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
  .brand:hover{text-decoration:none}
  .nav nav{margin-left:auto;display:flex;gap:20px;font-size:14px}
  .nav nav a{color:var(--dim)}.nav nav a.on,.nav nav a:hover{color:var(--ink);text-decoration:none}
  .wrap{max-width:720px;margin:0 auto;padding:56px 24px 96px}
  .kicker{display:flex;align-items:center;gap:12px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:18px}
  .kicker::after{content:"";flex:1;height:1px;background:var(--rule-faint)}
  h1{font-family:'Source Serif Pro',Georgia,serif;font-weight:600;font-size:clamp(30px,4.6vw,44px);line-height:1.12;letter-spacing:-.01em;margin:0 0 14px}
  .lede{font-size:18px;color:var(--dim);max-width:60ch;margin:0 0 10px}
  .meta{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--faint);display:flex;gap:14px;flex-wrap:wrap;margin:14px 0 40px}
  .meta a{color:var(--gold)}
  /* topic sections on index */
  .topic{margin:44px 0 0}
  .topic h2{font-family:'Source Serif Pro',Georgia,serif;font-weight:600;font-size:24px;margin:0 0 4px}
  .topic h2 a{color:var(--ink)}
  .topic .blurb{color:var(--dim);margin:0 0 16px;font-size:15px}
  .post-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule-faint)}
  .post-list li{padding:16px 0;border-bottom:1px solid var(--rule-faint);display:grid;grid-template-columns:1fr auto;gap:8px 20px;align-items:baseline}
  .post-list .t{font-family:'Source Serif Pro',Georgia,serif;font-size:19px;font-weight:600}
  .post-list .t a{color:var(--ink)}.post-list .t a:hover{color:var(--gold);text-decoration:none}
  .post-list .s{grid-column:1/-1;color:var(--dim);font-size:15px;margin:0}
  .post-list .d{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--faint);white-space:nowrap}
  .chip{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gold);background:var(--gold-soft);border-radius:999px;padding:2px 9px}
  /* article body */
  .prose{font-family:'Source Serif Pro',Georgia,serif;font-size:19px;line-height:1.7}
  .prose p{margin:0 0 1.25em}
  .prose h2{font-size:26px;font-weight:600;margin:2em 0 .6em;letter-spacing:-.01em}
  .prose h3{font-size:21px;font-weight:600;margin:1.6em 0 .5em}
  .prose blockquote{margin:1.4em 0;padding:4px 0 4px 20px;border-left:3px solid var(--gold);color:var(--dim);font-style:italic}
  .prose code{font-family:'JetBrains Mono',monospace;font-size:.82em;background:var(--bg-deep);padding:2px 6px;border-radius:4px}
  .prose pre{background:#1a1a1a;color:#f4efe3;padding:18px 20px;border-radius:10px;overflow:auto;font-size:14px;line-height:1.55}
  .prose pre code{background:none;padding:0;color:inherit;font-size:inherit}
  .prose img{max-width:100%;border-radius:8px}
  .prose hr{border:0;border-top:1px solid var(--rule-faint);margin:2.2em 0}
  .prose a{text-decoration:underline;text-decoration-color:var(--gold-bright);text-underline-offset:3px}
  .foot{margin-top:64px;padding-top:22px;border-top:1px solid var(--rule-faint);font-size:13px;color:var(--faint);display:flex;gap:16px;flex-wrap:wrap}
  .foot a{color:var(--dim)}
</style>
</head>
<body>
<header class="nav">
  <a class="brand" href="/"><span class="dot"></span>RayveLabs</a>
  <nav>
    <a href="/#labs">Labs</a>
    <a href="/#tools">Tools</a>
    <a href="/writing/" class="on">Writing</a>
    <a href="/#contact">Contact</a>
  </nav>
</header>
<main class="wrap">
{{BODY}}
<footer class="foot">
  <span>© 2026 Rayve Malhotra · RayveLabs</span>
  <a href="/writing/">All writing</a>
  <a href="/writing/feed.xml">RSS</a>
  <span>existence ≠ identity</span>
</footer>
</main>
</body>
</html>
